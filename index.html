<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAS 表單測試</title>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    form {
      background: #111;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
      width: 300px;
    }
    input, button {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
    }
    input {
      background: #222;
      color: #fff;
    }
    button {
      background: #0f0;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form id="testForm" method="POST" action="https://script.google.com/macros/s/AKfycbyeC15lJcLq1Ycl4mpitOtAEC2TJBbrgUf1SsUEtDfUXlxmHMi45IPBPNfrjzQuPnlFCw/exec">
    <h3>📮 GAS 表單測試</h3>
    <input type="text" name="name" placeholder="你的名字" required>
    <input type="email" name="email" placeholder="Email" required>
    <textarea name="message" placeholder="留言" rows="3" style="width:100%;background:#222;color:#fff;border:none;border-radius:6px;"></textarea>
    <button type="submit">送出</button>
  </form>
</body>
</html>
